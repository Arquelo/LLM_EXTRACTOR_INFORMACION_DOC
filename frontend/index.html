<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="nebula" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">Structured Output · Confiabilidad</p>
      <h1>LLM Extractor</h1>
      <p class="subtitle">
        Extracción validada de documentos (PDF/TXT) con reporte éxito / parcial / fallido
      </p>

      <section class="panel">
        <div class="status" id="status">Comprobando backend…</div>

        <label class="field-label" for="select-extractor">Extractor</label>
        <select id="select-extractor" class="select" disabled>
          <option value="">Cargando…</option>
        </select>

        <div class="upload">
          <p class="upload-label">Selecciona PDF/TXT o una carpeta</p>
          <div class="upload-actions">
            <label class="file-btn">
              Elegir archivo(s)
              <input
                id="input-files"
                type="file"
                accept=".pdf,.txt,application/pdf,text/plain"
                multiple
                hidden
              />
            </label>
            <label class="file-btn file-btn-secondary">
              Elegir carpeta
              <input
                id="input-folder"
                type="file"
                accept=".pdf,.txt,application/pdf,text/plain"
                webkitdirectory
                directory
                hidden
              />
            </label>
          </div>
          <p class="upload-summary" id="upload-summary">Ningún archivo seleccionado.</p>
        </div>

        <div class="actions-row">
          <button type="button" id="btn-extract" disabled>Ejecutar extracción</button>
          <button type="button" id="btn-muestras" class="btn-secondary" disabled>
            Correr muestras académicas
          </button>
          <button type="button" id="btn-report" class="btn-secondary" disabled>
            Ver último reporte
          </button>
          <button type="button" id="btn-clear" class="btn-secondary" disabled>
            Limpiar resultados
          </button>
        </div>
      </section>

      <section class="panel panel-result">
        <h2>Reporte del lote</h2>
        <div id="rates" class="rates" hidden></div>
        <div id="result-summary" class="result-summary" hidden></div>
        <h2>JSON completo</h2>
        <pre id="output">Aún no hay resultados.</pre>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
